<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 마음 명언</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F2EA;
    --ink:#3E3A36;
    --muted:#8A837B;
    --card:#FFFDF9;
    --line:#E6DFD3;
    --accent:#B9AE9F;
    --accent-soft:#EFEAE2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink)}
  body{
    font-family:"Noto Sans KR",sans-serif;
    min-height:100vh;
    display:flex;justify-content:center;
    padding:40px 20px 60px;
    transition:background-color .6s ease;
  }
  .wrap{width:100%;max-width:820px}
  header{text-align:center;margin-bottom:28px}
  header h1{
    font-family:"Gowun Batang",serif;
    font-size:34px;font-weight:700;letter-spacing:-.5px;
  }
  header p{margin-top:10px;font-size:19px;color:var(--muted)}

  .emotions{
    display:grid;grid-template-columns:repeat(3,1fr);gap:14px;
    margin-bottom:30px;
  }
  .emo{
    font-family:"Noto Sans KR",sans-serif;
    font-size:21px;font-weight:500;color:var(--ink);
    background:var(--card);
    border:2px solid var(--line);
    border-radius:18px;
    padding:22px 12px;
    cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:8px;
    transition:all .25s ease;
    line-height:1.3;
  }
  .emo .dot{width:16px;height:16px;border-radius:50%;background:var(--c)}
  .emo:hover{border-color:var(--c);transform:translateY(-2px)}
  .emo:focus-visible{outline:3px solid var(--c);outline-offset:3px}
  .emo.active{background:var(--c);border-color:var(--c);color:#fff;font-weight:700}
  .emo.active .dot{background:#fff}

  .card{
    background:var(--card);
    border:2px solid var(--line);
    border-radius:24px;
    padding:56px 48px 44px;
    min-height:340px;
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    text-align:center;
    position:relative;
    transition:border-color .4s ease;
  }
  .card .mark{
    font-family:"Gowun Batang",serif;
    font-size:80px;line-height:1;color:var(--accent);
    opacity:.55;margin-bottom:6px;height:44px;
  }
  .tag{
    font-size:17px;font-weight:500;color:var(--accent);
    background:var(--accent-soft);
    padding:6px 16px;border-radius:999px;margin-bottom:22px;
  }
  .quote{
    font-family:"Gowun Batang",serif;
    font-size:28px;font-weight:700;
    line-height:1.75;letter-spacing:-.3px;
    word-break:keep-all;
    max-width:640px;
  }
  .author{
    font-family:"Gowun Batang",serif;
    margin-top:24px;font-size:20px;color:var(--muted);
  }
  .placeholder .quote{font-weight:400;color:var(--muted);font-size:26px}
  .fade{animation:fade .6s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .more{
    margin-top:34px;
    font-family:"Noto Sans KR",sans-serif;
    font-size:20px;font-weight:500;
    color:#fff;background:var(--accent);
    border:none;border-radius:999px;
    padding:16px 38px;cursor:pointer;
    transition:filter .2s ease, transform .2s ease;
  }
  .more:hover{filter:brightness(.95);transform:translateY(-1px)}
  .more[hidden]{display:none}
  .count{margin-top:16px;font-size:16px;color:var(--muted)}

  @media (max-width:640px){
    body{padding:28px 14px 48px}
    header h1{font-size:28px}
    header p{font-size:17px}
    .emotions{grid-template-columns:repeat(2,1fr);gap:12px}
    .emo{font-size:19px;padding:18px 8px}
    .card{padding:44px 24px 36px;min-height:320px}
    .quote{font-size:24px}
    .author{font-size:18px}
    .more{font-size:19px;padding:15px 32px}
  }
</style>
</head>

const navEl = document.getElementById('emotions');
const cardEl = document.getElementById('card');
const bags = {};      // 감정별 남은 순서(섞인 목록)
const lastShown = {}; // 감정별 직전 명언
let current = null;

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function nextIndex(emo){
  if(!bags[emo.id] || bags[emo.id].length===0){
    let order = shuffle(emo.quotes.map((_,i)=>i));
    if(order[0]===lastShown[emo.id] && order.length>1){
      [order[0],order[1]]=[order[1],order[0]];
    }
    bags[emo.id]=order;
  }
  const idx = bags[emo.id].shift();
  lastShown[emo.id]=idx;
  return idx;
}

function esc(s){
  return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function show(emo){
  current = emo;
  const root = document.documentElement;
  root.style.setProperty('--accent', emo.color);
  root.style.setProperty('--accent-soft', emo.bg);
  document.body.style.backgroundColor = emo.bg;

  [...navEl.children].forEach(b=>{
    const on = b.dataset.id===emo.id;
    b.classList.toggle('active', on);
    b.setAttribute('aria-pressed', on);
  });

  const [text, author] = emo.quotes[nextIndex(emo)];
  const seen = emo.quotes.length - bags[emo.id].length;
  cardEl.classList.remove('placeholder','fade');
  cardEl.style.borderColor = emo.color;
  void cardEl.offsetWidth;
  cardEl.classList.add('fade');
  cardEl.innerHTML = `
    <div class="mark">“</div>
    <div class="tag">${esc(emo.label)}</div>
    <div class="quote">${esc(text)}</div>
    <div class="author">— ${esc(author)}</div>
    <button class="more" id="more" type="button">다른 명언 보기</button>
    <div class="count">${seen} / ${emo.quotes.length}</div>`;
  document.getElementById('more').addEventListener('click',()=>show(current));
}

EMOTIONS.forEach(emo=>{
  const b = document.createElement('button');
  b.className='emo';
  b.type='button';
  b.dataset.id=emo.id;
  b.style.setProperty('--c', emo.color);
  b.setAttribute('aria-pressed','false');
  b.innerHTML = `<span class="dot"></span><span>${esc(emo.label)}</span>`;
  b.addEventListener('click',()=>show(emo));
  navEl.appendChild(b);
});
</script>
